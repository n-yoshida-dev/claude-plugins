<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>開発ダッシュボード</title>
<style>
  /* 色の名前。状態色（warn / bad）は必ず記号（! ✕）を添えて使い、色だけで意味を伝えない */
  :root {
    --bg: #f4f5f7; --card: #ffffff; --line: #e4e7ec; --track: #e9ecf1;
    --ink: #172033; --sub: #566074; --faint: #8b93a3;
    --link: #1f63b8;
    --warn: #93600a; --warn-bg: #fdf1d6;
    --bad: #b93a2a; --bad-bg: #fbe3dd;
    /* あなた待ちの強調色。失敗の赤（--bad）と見分けがつくよう紫系にする */
    --you: #6d3fc0; --you-bg: #efe8fb;
    --tag: #eef1f5;
    /* 帯の段階色（薄い → 濃い）。プロジェクトに色の決まりがあれば、その値に差し替える */
    --l1: #86b6ef; --l2: #5598e7; --l3: #2a78d6; --l4: #1c5cab; --l5: #104281;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151d; --card: #181e29; --line: #262e3d; --track: #232b39;
      --ink: #e7ebf3; --sub: #a3acbe; --faint: #737d90;
      --link: #8db6f2;
      --warn: #f0c050; --warn-bg: #36290e;
      --bad: #f28b74; --bad-bg: #3a1d17;
      --you: #b99af0; --you-bg: #2a2140;
      --tag: #242c3a;
      --l1: #9ec5f4; --l2: #6aa6ec; --l3: #3f88dd; --l4: #2d6fc0; --l5: #1f579c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', sans-serif;
  }
  a { color: inherit; text-decoration: none; } a:hover { text-decoration: underline; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 16px; }

  /* 見出し行：名前と、いつのデータか */
  header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  header h1 { font-size: 20px; margin: 0; }
  header .meta { color: var(--faint); font-size: 13px; margin-left: auto; white-space: nowrap; }
  header .meta.stale { color: var(--warn); }

  /* 異常だけを出す帯 */
  .alert { display: flex; gap: 8px; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
  .alert.error { background: var(--bad-bg); color: var(--bad); }
  .alert.warn { background: var(--warn-bg); color: var(--warn); }
  .alert span:last-child { color: var(--ink); overflow-wrap: anywhere; }
  .alert a { text-decoration: underline; }

  /* 並び：狭い幅では 1 列。広い幅では左に「あなた待ち・今のタスク」、右に「変更・固有の指標」 */
  .grid { display: grid; gap: 12px; margin-top: 12px; }
  .col { display: grid; gap: 12px; align-content: start; min-width: 0; }
  @media (min-width: 900px) { .grid { grid-template-columns: 3fr 2fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  .card h2 { font-size: 14px; margin: 0 0 6px; color: var(--sub); font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
  .card h2 .count { font-size: 22px; color: var(--you); font-variant-numeric: tabular-nums; }

  /* 進捗：数字・帯・残りを 1 行に、その下にフェーズ名 */
  .progress { display: flex; align-items: center; gap: 12px; }
  .progress .pct { font-size: 30px; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .progress .pct small { font-size: 15px; font-weight: 500; color: var(--sub); margin-left: 1px; }
  .progress .bar { flex: 1; height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .progress .bar i { display: block; height: 100%; background: var(--l3); }
  .progress .of { font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .phase { font-size: 13px; color: var(--sub); margin-top: 2px; }

  /* 今のタスクは大きく、続く 4 件は小さく薄く。大きさの差で「今」と「この後」を分ける */
  .now { font-size: 18px; font-weight: 600; line-height: 1.45; margin: 14px 0 6px; }
  ol.next { margin: 0; padding-left: 1.4em; color: var(--sub); font-size: 14px; }
  ol.next li { padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 1 行ずつの一覧。長い題名は 1 行で切り、全文はマウスを載せると出る */
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); min-width: 0; }
  ul.list li:first-child { border-top: 0; }
  ul.list li.extra { display: none; } ul.list.open li.extra { display: flex; }
  .txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src { flex: none; font-size: 12px; color: var(--faint); white-space: nowrap; }
  .tag { flex: none; font-size: 11px; line-height: 20px; padding: 0 8px; border-radius: 4px; background: var(--tag); color: var(--sub); white-space: nowrap; }
  /* 種類のタグは、あなたの判断が要る「判断」だけ色を付ける（確認・作業まで色を付けると、状態の色と紛れる） */
  .tag.k-判断 { background: var(--you-bg); color: var(--you); }
  .tag.blocked { background: transparent; border: 1px solid var(--line); color: var(--faint); }
  .more-btn { margin-top: 4px; font: inherit; font-size: 13px; color: var(--link); background: none; border: 0; padding: 2px 0; cursor: pointer; }

  /* 状態の記号。色は異常にだけ使い、成功（✓）は灰色にする（毎回緑だと黄や赤が埋もれる） */
  .sym { flex: none; width: 1.2em; text-align: center; font-weight: 700; }
  .s-good, .s-na { color: var(--faint); } .s-bad { color: var(--bad); } .s-warn { color: var(--warn); } .s-run { color: var(--link); }

  /* 押して全文に切り替えた題名は、折り返して全部見せる */
  span.txt[title], ol.next li[title], .now[title] { cursor: pointer; }
  .full { white-space: normal !important; display: block !important; -webkit-line-clamp: unset !important; overflow: visible !important; }

  /* プロジェクト固有の指標（数字・帯） */
  .nums { display: flex; gap: 20px; flex-wrap: wrap; }
  .nums b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .nums span { font-size: 12px; color: var(--faint); }
  .levels { display: flex; gap: 2px; height: 10px; border-radius: 3px; overflow: hidden; margin: 12px 0 4px; }
  .levels i { display: block; min-width: 4px; }
  .levels i[data-l="0"] { background: var(--track); }
  .levels i[data-l="1"] { background: var(--l1); } .levels i[data-l="2"] { background: var(--l2); } .levels i[data-l="3"] { background: var(--l3); }
  .levels i[data-l="4"] { background: var(--l4); } .levels i[data-l="5"] { background: var(--l5); }
  .legend { font-size: 12px; color: var(--faint); }

  /* 折りたたみ（詳しく見たいときだけ開く）。閉じているときは 1 行の帯を横に並べる */
  .folds { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  details[open] { flex-basis: 100%; }
  .card details { border: 0; background: none; margin-top: 8px; }
  summary { cursor: pointer; padding: 8px 14px; font-size: 13px; color: var(--sub); }
  .card summary { padding: 0; }
  summary .src { margin-left: 4px; }
  details > div { padding: 0 16px 12px; font-size: 14px; }
  .md h3 { font-size: 12px; color: var(--faint); font-weight: 500; margin: 12px 0 2px; }
  .md p { margin: 6px 0; } .md ul { margin: 4px 0; padding-left: 1.3em; }
  .md pre, pre.out { background: var(--tag); padding: 8px 10px; border-radius: 6px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
  code { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 0.9em; background: var(--tag); padding: 0 4px; border-radius: 3px; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; }
  .empty { color: var(--faint); font-size: 14px; padding: 4px 0; }
  #err { background: var(--bad-bg); color: var(--bad); padding: 12px 16px; border-radius: 8px; }

  @media (max-width: 480px) {
    .wrap { padding: 12px; }
    /* 狭い幅では題名を 2 行まで見せる */
    .txt { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="title">開発ダッシュボード</h1><span class="meta" id="meta"></span></header>
  <div id="err" hidden></div>
  <main id="main"></main>
</div>

<!-- update.mjs が作る data.js（window.DASHBOARD_DATA）。JS にしてあるので、この HTML をダブルクリックで開いても読める -->
<script src="data.js"></script>
<script>
// data.js のデータを描く。状態は持たない（表示するだけ）。
// この画面は横断タスクボード（ops）の「詳しく見る」の行き先。説明の文・欄の名前・種類の札は出さず、並びと大きさで読ませる。
// 正本の文章は長いので、一覧では「短い題名」に縮めて出し、全文は title 属性（マウスを載せると出る）に残す。

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

/** 全角の括弧書き（…）を入れ子ごと取り除く */
function dropParens(s) {
  let out = ''
  let depth = 0
  for (const ch of s) {
    if (ch === '（') { depth++; continue }
    if (ch === '）') { if (depth > 0) depth--; continue }
    if (depth === 0) out += ch
  }
  return out
}

/** 一覧用の短い題名にする：記法・括弧書き・後ろの注記・2 文目以降を落とし、長ければ切る */
function short(s, { max = 48, colon = true } = {}) {
  let t = String(s ?? '').replace(/^【[^】]+】\s*/, '')
  t = t.replace(/([）。])\s*\*\*.*$/, '$1') // 後ろに付いた太字の注記
  t = t.replace(/`/g, '').replace(/\*\*/g, '')
  t = dropParens(t).split('。')[0]
  const c = t.indexOf('：')
  if (colon && c >= 8) t = t.slice(0, c)
  t = t.replace(/\s+/g, ' ').trim()
  return t.length > max ? t.slice(0, max - 1) + '…' : t
}

/** 先頭の【…】を種類のタグとして取り出す（「ユーザー確認」→「確認」） */
const bracketTag = (s) => (String(s).match(/^【([^】]+)】/)?.[1] ?? '').replace(/^ユーザー/, '')

/** コミットや CI の題名から、種類（feat: 等）と PR 番号を落とした短い題名を取り出す */
function commitTitle(s) {
  const m = String(s ?? '').match(/^(\w+)(\([^)]*\))?!?:\s*(.*)$/)
  return short((m ? m[3] : s).replace(/\s*\(#\d+\)\s*$/, ''), { max: 40 })
}

function ago(iso) {
  if (!iso) return ''
  const m = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000))
  if (m < 60) return `${m}分前`
  if (m < 60 * 48) return `${Math.round(m / 60)}時間前`
  return `${Math.round(m / 1440)}日前`
}

/** 状態 → 記号。色だけに頼らないよう、必ず記号を一緒に出す */
const SYM = { good: '✓', bad: '✕', warn: '!', run: '●', na: '–' }
function runState(r) {
  if (!r) return 'na'
  if (r.status !== 'completed') return 'run'
  if (r.conclusion === 'success') return 'good'
  if (r.conclusion === 'cancelled') return 'warn'
  if (r.conclusion === 'skipped' || r.conclusion === 'neutral') return 'na'
  return 'bad'
}

/** 引き継ぎメモ（折りたたみの中）用の最小限の Markdown */
function md(text) {
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  const out = []
  let para = [], list = null, pre = null
  const flushP = () => { if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = [] } }
  const flushL = () => { if (list) { out.push(`<ul>${list.map((l) => `<li>${inline(l)}</li>`).join('')}</ul>`); list = null } }
  for (const raw of (text ?? '').split('\n')) {
    if (pre !== null) { if (raw.startsWith('```')) { out.push(`<pre>${esc(pre.join('\n'))}</pre>`); pre = null } else pre.push(raw); continue }
    if (raw.startsWith('```')) { flushP(); flushL(); pre = []; continue }
    const line = raw.trim()
    if (!line) { flushP(); flushL(); continue }
    const m = line.match(/^[-*] +(.*)$/)
    if (m) { flushP(); (list ??= []).push(m[1]); continue }
    if (list && raw.startsWith('  ')) { list[list.length - 1] += ' ' + line; continue }
    flushL(); para.push(line)
  }
  flushP(); flushL()
  return out.join('')
}

const li = (inner, cls = '') => `<li${cls ? ` class="${cls}"` : ''}>${inner}</li>`
const txt = (shortText, full) => `<span class="txt" title="${esc(full ?? shortText)}">${esc(shortText)}</span>`
const fold = (summary, body) => `<details><summary>${summary}</summary><div>${body}</div></details>`

// ★ プロジェクト固有の指標を、下の render() が描く形（update.mjs の readProjectSpecific() が返す形）で返す。
//   テンプレートの update.mjs を使っていれば d.specific がそのままその形。別の形で持っているリポジトリは、ここで変換する
function specific(d) {
  return d.specific ?? null
}

function render(d) {
  const t = d.todo, g = d.git, gh = d.github, x = specific(d), h = d.handoff
  const name = d.project.name
  document.title = `${name} 開発ダッシュボード`
  document.getElementById('title').innerHTML = d.project.repoUrl ? `<a href="${esc(d.project.repoUrl)}">${esc(name)}</a>` : esc(name)

  // 見出し行：いつのデータか。1 時間より古ければ色で知らせる（いつも出る文字なので、言葉は足さない）
  const ageMin = (Date.now() - Date.parse(d.generatedAt)) / 60000
  const meta = document.getElementById('meta')
  meta.className = 'meta' + (ageMin > 60 ? ' stale' : '')
  meta.textContent = (g.branch && g.branch !== 'main' ? `${g.branch} · ` : '') + ago(d.generatedAt)

  const html = []

  // 1. 異常だけ（CI 失敗・固有の指標の異常・引き継ぎの遅れ・取得失敗）。作業ツリーの汚れは異常ではないので、ここではなく下の折りたたみに出す
  for (const a of d.alerts.filter((a) => a.level === 'error' || a.level === 'warn')) {
    const body = a.href ? `<a href="${esc(a.href)}">${esc(a.text)}</a>` : esc(a.text)
    html.push(`<div class="alert ${a.level}"><span>${a.level === 'error' ? '✕' : '!'}</span><span>${body}</span></div>`)
  }

  // 2. 人間待ち：Beads（ラベル human）と TODO.md「確認待ち」と、固有の「人が決めるもの」
  const KIND = { decision: '判断', review: '確認', action: '作業' }
  const human = [
    ...d.beads.human.map((b) => {
      const title = b.title.replace(/^\[[^\]]+\]\s*/, '')
      const kind = b.labels.map((l) => KIND[l]).find(Boolean) ?? '確認'
      const pri = Number.isFinite(Number(b.priority)) ? Number(b.priority) : 4
      return { kind, text: short(title), full: `${title}（${b.id}）`, blocked: b.blockedBy.length > 0, pri }
    }),
    ...(t?.askItems ?? []).map((a) => {
      const full = a.text.replace(/\s*完了条件：.*$/, '')
      return { kind: bracketTag(full) || '確認', text: short(full), full: `${full}（TODO.md）`, blocked: false, pri: 5 }
    }),
    ...(x?.human ?? []).map((it) => ({ kind: it.kind ?? '判断', text: it.text, full: it.full ?? it.text, blocked: false, pri: 2 })),
  ]
  // 優先度の高い順に並べる（ハブと同じ）：Beads は priority（0 が最優先）、固有の human は P2 相当、TODO の確認待ちは最後。
  // sort は安定なので、同じ優先度の中では元の並びが保たれる
  human.sort((a, b) => a.pri - b.pri)
  // 上位 TOP_HUMAN 件だけ出し、残りは「ほか N 件」で開く（全部並べると下の欄が画面の外に押し出される）
  const TOP_HUMAN = 6
  const humanCard = `<section class="card"><h2>あなた待ち <span class="count">${human.length}</span></h2>
    ${human.length
      ? `<ul class="list" id="human-list">${human.map((it, i) => li(
          `<span class="tag k-${esc(it.kind)}">${esc(it.kind)}</span>${txt(it.text, it.full)}` + (it.blocked ? '<span class="tag blocked">ブロック中</span>' : ''),
          i >= TOP_HUMAN ? 'extra' : '')).join('')}</ul>` +
        (human.length > TOP_HUMAN ? `<button type="button" class="more-btn" data-more="human-list">ほか ${human.length - TOP_HUMAN} 件</button>` : '')
      : '<div class="empty">なし</div>'}</section>`

  // 3. 進捗と今のタスク（TODO.md）。進捗の帯・フェーズ名・今のタスク・この後 4 件を 1 枚に重ねる
  const pct = t && t.total.total ? Math.floor((100 * t.total.done) / t.total.total) : 0
  const first = t?.openTasks[0]
  const rest = (t?.openTasks ?? []).slice(1, 5)
  const todoCard = `<section class="card">
    <div class="progress"><span class="pct">${pct}<small>%</small></span><span class="bar"><i style="width:${pct}%"></i></span>
      <span class="of">${t?.total.done ?? '-'} / ${t?.total.total ?? '-'}</span></div>
    ${t?.currentPhase ? `<div class="phase">${esc(short(t.currentPhase, { colon: false, max: 40 }))}</div>` : ''}
    ${first ? `<div class="now" title="${esc(`${first.text}（TODO.md:${first.line}）`)}">${esc(short(first.text, { max: 60 }))}</div>` : ''}
    ${rest.length ? `<ol class="next" start="2">${rest.map((r) => `<li title="${esc(r.text)}">${esc(short(r.text, { max: 40 }))}</li>`).join('')}</ol>` : ''}
  </section>`

  // 4. 変更：開いている PR と最近のコミット。main の CI の結果は、そのコミットの行の先頭に記号で出す
  //    （CI の実行と最近のコミットは同じ変更なので、別の欄にすると同じ題名が 2 回並ぶ）。
  //    実行の題名はコミットの 1 行目に「 (#PR 番号)」が付いたもの。PR 番号があればそれで、無ければ題名で突き合わせる。
  //    題名だけで突き合わせると、同じ題名のコミットに別のコミットの結果が付く。PR 番号の無い同じ題名のコミットには記号を付けない
  const noPr = (s) => String(s ?? '').replace(/\s*\(#\d+\)\s*$/, '')
  const keyOf = (title, pr) => (pr ? `#${pr}` : `t:${noPr(title)}`)
  const runsOf = new Map()
  for (const r of gh.runs.filter((r) => r.branch === 'main')) {
    const k = keyOf(r.title, String(r.title ?? '').match(/\(#(\d+)\)\s*$/)?.[1])
    runsOf.set(k, [...(runsOf.get(k) ?? []), r])
  }
  const shown = g.commits.slice(0, 6)
  const sameTitle = (c) => !c.pr && shown.filter((o) => !o.pr && noPr(o.subject) === noPr(c.subject)).length > 1
  // 1 つのコミットで複数のワークフロー（検査と公開など）が動いたときは、いちばん悪い結果を出す（1 つでも失敗なら ✕）
  const RANK = { bad: 4, warn: 3, run: 2, good: 1, na: 0 }
  const worstRun = (runs) => runs.reduce((w, r) => (!w || RANK[runState(r)] > RANK[runState(w)] ? r : w), null)
  const failedJobs = (jobs) => (jobs ?? []).filter((j) => j.conclusion === 'failure').map((j) => j.name.replace(/\s*[（(].*$/, ''))
  const prRows = gh.openPrs.map((p) => {
    const kind = p.checks === 'success' ? 'good' : p.checks === 'failure' ? 'bad' : p.checks === 'pending' ? 'run' : 'na'
    const failed = (p.failed ?? []).map((n) => n.replace(/\s*[（(].*$/, ''))
    const label = `#${p.number} ${commitTitle(p.title)}` + (failed.length ? ` — ${failed.join(', ')}` : '')
    return li(`<span class="sym s-${kind}">${SYM[kind]}</span><a class="txt" href="${esc(p.url ?? '')}" title="${esc(p.title)}">${esc(label)}</a><span class="src">${ago(p.updatedAt)}</span>`)
  })
  const commitRows = shown.map((c) => {
    const runs = sameTitle(c) ? [] : runsOf.get(keyOf(c.subject, c.pr)) ?? []
    const run = worstRun(runs)
    const kind = run ? runState(run) : 'na'
    const failed = runs.flatMap((r) => failedJobs(r.jobs))
    const label = commitTitle(c.subject) + (failed.length ? ` — ${failed.join(', ')}` : '')
    const href = c.pr && d.project.repoUrl ? `${d.project.repoUrl}/pull/${c.pr}` : run?.url
    const sym = `<span class="sym s-${kind}">${run ? SYM[kind] : ''}</span>`
    return li(sym + (href ? `<a class="txt" href="${esc(href)}" title="${esc(c.subject)}">${esc(label)}</a>` : txt(label, c.subject)) + `<span class="src">${ago(c.date)}</span>`)
  })
  const changeCard = `<section class="card">
    ${gh.available ? '' : `<div class="empty">${esc(gh.error ?? 'GitHub を取得できず')}</div>`}
    <ul class="list">${prRows.join('')}${commitRows.join('')}</ul></section>`

  // 5. プロジェクト固有のカード（null なら出さない）。見出しは名前だけ、異常があれば記号を添える。補足の文と出力は畳む
  let specificCard = ''
  if (x) {
    const s = x.status && x.status.kind !== 'good' && x.status.kind !== 'na' ? ` <span class="s-${x.status.kind}">${SYM[x.status.kind] ?? ''} ${esc(x.status.label ?? '')}</span>` : ''
    specificCard = `<section class="card"><h2${x.note ? ` title="${esc(x.note)}"` : ''}>${esc(short(x.title ?? '', { colon: false }))}${s}</h2>
      ${x.stats?.length ? `<div class="nums">${x.stats.slice(0, 4).map((s) => `<div><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('')}</div>` : ''}
      ${x.bars?.length ? `<div class="levels">${x.bars.map((b, i) => (b.value ? `<i data-l="${b.level ?? Math.min(i + 1, 5)}" style="flex:${b.value}" title="${esc(b.label)}: ${esc(b.value)}"></i>` : '')).join('')}</div>
      <div class="legend">${x.bars.map((b) => `${esc(b.label)} ${esc(b.value)}`).join(' · ')}</div>` : ''}
      ${x.output?.length ? `<details><summary><span class="legend">${x.output.length} 行</span></summary><pre class="out">${esc(x.output.join('\n'))}</pre></details>` : ''}
    </section>`
  }

  html.push(`<div class="grid"><div class="col">${humanCard}${todoCard}</div><div class="col">${changeCard}${specificCard}</div></div>`)

  // 6. 詳しく見たいときだけ開く。閉じているときは名前と件数だけの帯
  const more = []
  if (h) {
    const lag = h.commitsSince ? `${h.commitsSince} コミット前` : ''
    more.push(fold(`引き継ぎ${lag ? `<span class="src">${lag}</span>` : ''}`,
      `<div class="md"><h3>${esc(h.sections.current?.title ?? '現在地')}</h3>${md(h.sections.current?.body)}<h3>${esc(h.sections.next?.title ?? '次にやること')}</h3>${md(h.sections.next?.body)}</div>`))
  }
  if (d.decisions.length) {
    more.push(fold(`合意<span class="src">${d.decisions.length}</span>`,
      `<ul class="list">${d.decisions.map((x) => li(`<span class="src mono">${esc(x.date)}</span>${txt(short(x.title, { max: 60 }), x.title)}`)).join('')}</ul>`))
  }
  if (d.beads.others.length) {
    more.push(fold(`Claude の付箋<span class="src">${d.beads.others.length}</span>`,
      `<ul class="list">${d.beads.others.map((b) => li(`<span class="src mono">${esc(b.id)}</span>${txt(short(b.title.replace(/^\[[^\]]+\]\s*/, '')))}`)).join('')}</ul>`))
  }
  if (g.dirty.length || g.ahead) {
    more.push(fold(`<span class="s-warn">!</span> ${g.dirty.length ? `未コミット<span class="src">${g.dirty.length}</span>` : `未 push<span class="src">${g.ahead}</span>`}`,
      `<ul class="list">${g.dirty.map((f) => li(`<span class="src mono">${esc(f.status)}</span><span class="txt mono">${esc(f.path)}</span>`)).join('') || li(`<span class="txt">${esc(g.branch)} に未 push のコミット ${g.ahead} 件</span>`)}</ul>`))
  }
  html.push(`<div class="folds">${more.join('')}</div>`)

  document.getElementById('main').innerHTML = html.join('')
}

try {
  if (!window.DASHBOARD_DATA) throw new Error('data.js が無い')
  render(window.DASHBOARD_DATA)
} catch (e) {
  const el = document.getElementById('err')
  el.hidden = false
  el.textContent = `データを読めません（${e.message}）。リポジトリで node dashboard/update.mjs を実行してください`
}
// 「ほか N 件」：隠していた行を開く。もう一度押すと閉じる
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-more]')
  if (!btn) return
  const list = document.getElementById(btn.dataset.more)
  if (!list) return
  if (!btn.dataset.label) btn.dataset.label = btn.textContent
  const open = list.classList.toggle('open')
  btn.textContent = open ? '閉じる' : btn.dataset.label
})
// 縮めた題名を押すと全文に切り替わる（マウスの無いスマートフォン向け）。もう一度押すと戻る
document.addEventListener('click', (e) => {
  const el = e.target.closest('span.txt[title], ol.next li[title], .now[title]')
  if (!el) return
  if (el.dataset.short == null) {
    el.dataset.short = el.textContent
    el.textContent = el.title
    el.classList.add('full')
  } else {
    el.textContent = el.dataset.short
    delete el.dataset.short
    el.classList.remove('full')
  }
})
</script>
</body>
</html>
